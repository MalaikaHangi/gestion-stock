name: Vérifier les stocks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: gestion_stock_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d gestion_stock_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/gestion_stock_test
      TEST_DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/gestion_stock_test
      VITE_API_URL: https://api.example.invalid
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Activer pnpm
        run: npm install --global pnpm@11.25.0
      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile
      - name: Migrer la base de test
        run: pnpm --filter backend migrate
      - name: Compiler les applications
        run: pnpm build
      - name: Vérifier les transactions et permissions
        run: pnpm test
