# Free API only. PostgreSQL is hosted on Neon Free; no paid Render resources.
services:
  - type: web
    name: gestion-stock-api
    runtime: node
    region: frankfurt
    plan: free
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: npx --yes pnpm@11.25.0 install --frozen-lockfile && npx --yes pnpm@11.25.0 --filter backend build
    startCommand: node backend/scripts/start-hosted.mjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_MIGRATION_URL
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://gestion-stock-green.vercel.app
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: MANAGER_EMAIL
        value: responsable@gestion-stock.local
      - key: MANAGER_PASSWORD
        generateValue: true
